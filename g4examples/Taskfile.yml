# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!

  # Geant4 version to use
  # Override: `task b1:build G4_VERSION=11.3.2` or set the G4_VERSION environment variable
  G4_VERSION: '{{env "G4_VERSION" | default "11.4.3"}}'
  G4_ROOT: '{{env "G4_ROOT" | default "/Users/shotakaha/geant4"}}'

  # Install location (derived from the version)
  G4_PREFIX: '{{.G4_ROOT}}/v{{.G4_VERSION}}/install'
  G4_ENV_SH: '{{.G4_PREFIX}}/bin/geant4.sh'
  G4_EXAMPLES: '{{.G4_PREFIX}}/share/Geant4/examples'

  # geant4.sh must be sourced from bin/ (it cannot self-locate otherwise).
  # Prefix a command with this to run it with the Geant4 environment.
  G4_SOURCE: 'cd {{.G4_PREFIX}}/bin && . ./geant4.sh && cd - >/dev/null &&'

  # Example path under examples/basic, e.g. B1 or B2/B2b
  EXAMPLE: B1

tasks:
  default:
    desc: List tasks and usage
    cmds:
      - task --list
      - echo ""
      - 'echo "Usage:"'
      - 'echo "  task example:build EXAMPLE=B2/B2b       # copy, configure, and build"'
      - 'echo "  task example:run EXAMPLE=B2/B2b         # run app/run1.mac"'
      - 'echo "  task example:run EXAMPLE=B1 ARGS=app/run2.mac"'
      - 'echo "  task example:clean EXAMPLE=B1           # remove build/"'
      - echo ""
      - 'echo "Other:"'
      - 'echo "  task b1:build                           # shortcuts: b1, b2a, b2b"'
      - 'echo "  task g4:env                             # check the Geant4 environment"'
      - 'echo "  task g4:versions                       # installed Geant4 versions"'
      - 'echo "  task build G4_VERSION=11.3.2           # override the version"'
    silent: true

  hello:
    desc: Print greeting
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  # --- Geant4 environment ---------------------------------------------
  g4:versions:
    desc: List installed versions
    cmds:
      - ls -d {{.G4_ROOT}}/v*/install 2>/dev/null | sed -E 's#.*/v(.*)/install#\1#'
    silent: true

  g4:env:
    desc: Load env and show version
    preconditions:
      - test -f {{.G4_ENV_SH}}
    cmds:
      - '{{.G4_SOURCE}} geant4-config --version'
    silent: true

  # --- Generic example tasks (pass EXAMPLE=<path under basic>) --------
  # Each example lives in <name>/app (source) and <name>/build (out-of-source).
  example:copy:
    desc: Copy EXAMPLE to <name>/app
    preconditions:
      - test -d {{.G4_EXAMPLES}}/basic/{{.EXAMPLE}}
    cmds:
      - mkdir -p {{base .EXAMPLE}}
      - cp -R {{.G4_EXAMPLES}}/basic/{{.EXAMPLE}} {{base .EXAMPLE}}/app
    status:
      - test -f {{base .EXAMPLE}}/app/example{{base .EXAMPLE}}.cc

  example:build:
    desc: Configure and build EXAMPLE (copies it first if missing)
    deps: [example:copy]
    preconditions:
      - test -f {{.G4_ENV_SH}}
    cmds:
      - 'cd {{base .EXAMPLE}} && {{.G4_SOURCE}} cmake -S app -B build -DGeant4_DIR={{.G4_PREFIX}}/lib/cmake/Geant4'
      - 'cd {{base .EXAMPLE}} && {{.G4_SOURCE}} cmake --build build -j'

  example:run:
    desc: Run EXAMPLE (ARGS defaults to app/run1.mac)
    deps: [example:build]
    cmds:
      - 'cd {{base .EXAMPLE}} && {{.G4_SOURCE}} ./build/example{{base .EXAMPLE}} {{.ARGS | default "app/run1.mac"}}'

  example:clean:
    desc: Remove EXAMPLE build/
    cmds:
      - rm -rf {{base .EXAMPLE}}/build

  # --- Shortcuts ------------------------------------------------------
  b1:build:
    desc: Build B1
    cmds:
      - task: example:build
        vars:
          EXAMPLE: B1

  b1:run:
    desc: Run B1 (app/run1.mac)
    cmds:
      - task: example:run
        vars:
          EXAMPLE: B1

  b1:clean:
    desc: Clean B1 build
    cmds:
      - task: example:clean
        vars:
          EXAMPLE: B1

  b2a:build:
    desc: Build B2a
    cmds:
      - task: example:build
        vars:
          EXAMPLE: B2/B2a

  b2a:run:
    desc: Run B2a (app/run1.mac)
    cmds:
      - task: example:run
        vars:
          EXAMPLE: B2/B2a

  b2a:clean:
    desc: Clean B2a build
    cmds:
      - task: example:clean
        vars:
          EXAMPLE: B2/B2a

  b2b:build:
    desc: Build B2b
    cmds:
      - task: example:build
        vars:
          EXAMPLE: B2/B2b

  b2b:run:
    desc: Run B2b (app/run1.mac)
    cmds:
      - task: example:run
        vars:
          EXAMPLE: B2/B2b

  b2b:clean:
    desc: Clean B2b build
    cmds:
      - task: example:clean
        vars:
          EXAMPLE: B2/B2b
