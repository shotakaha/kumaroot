# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!

  # Geant4 version to use
  # Override: `task b1:build G4_VERSION=11.3.2` or set the G4_VERSION environment variable
  G4_VERSION: '{{env "G4_VERSION" | default "11.4.3"}}'
  G4_ROOT: '{{env "G4_ROOT" | default "/Users/shotakaha/geant4"}}'

  # Install location (derived from the version)
  G4_PREFIX: '{{.G4_ROOT}}/v{{.G4_VERSION}}/install'
  G4_ENV_SH: '{{.G4_PREFIX}}/bin/geant4.sh'
  G4_EXAMPLES: '{{.G4_PREFIX}}/share/Geant4/examples'

  # Example name
  EXAMPLE_B1: B1

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list
    silent: true

  hello:
    desc: Print greeting
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  # --- Geant4 environment ---------------------------------------------
  g4:versions:
    desc: List installed versions
    cmds:
      - ls -d {{.G4_ROOT}}/v*/install 2>/dev/null | sed -E 's#.*/v(.*)/install#\1#'
    silent: true

  g4:env:
    desc: Load env and show version
    preconditions:
      - test -f {{.G4_ENV_SH}}
    cmds:
      - cd {{.G4_PREFIX}}/bin && . ./geant4.sh && cd - >/dev/null && geant4-config --version
    silent: true

  # --- B1 -------------------------------------------------------------
  b1:copy:
    desc: Copy B1 example
    preconditions:
      - test -d {{.G4_EXAMPLES}}/basic/{{.EXAMPLE_B1}}
    cmds:
      - cp -R {{.G4_EXAMPLES}}/basic/{{.EXAMPLE_B1}} {{.EXAMPLE_B1}}
    status:
      - test -f {{.EXAMPLE_B1}}/exampleB1.cc

  b1:build:
    desc: Build B1 example
    deps: [b1:copy]
    preconditions:
      - test -f {{.G4_ENV_SH}}
    cmds:
      - cd {{.G4_PREFIX}}/bin && . ./geant4.sh && cd - >/dev/null && cmake -S {{.EXAMPLE_B1}} -B {{.EXAMPLE_B1}}/build -DGeant4_DIR={{.G4_PREFIX}}/lib/cmake/Geant4
      - cd {{.G4_PREFIX}}/bin && . ./geant4.sh && cd - >/dev/null && cmake --build {{.EXAMPLE_B1}}/build -j

  b1:run:
    desc: Run B1 example (run1.mac)
    deps: [b1:build]
    dir: '{{.EXAMPLE_B1}}'
    cmds:
      - cd {{.G4_PREFIX}}/bin && . ./geant4.sh && cd - >/dev/null && ./build/exampleB1 run1.mac

  b1:clean:
    desc: Clean B1 build
    cmds:
      - rm -rf {{.EXAMPLE_B1}}/build
