# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!

  # Geant4 インストール先（環境変数 G4_PREFIX で上書き可能）
  G4_PREFIX: '{{env "G4_PREFIX" | default "/Users/shotakaha/geant4/v11.4.0/install"}}'
  G4_EXAMPLES: '{{.G4_PREFIX}}/share/Geant4/examples'

  # サンプル名（例: task b1:build）
  EXAMPLE_B1: B1

tasks:
  default:
    desc: タスク一覧を表示
    cmds:
      - task --list
    silent: true

  hello:
    desc: 挨拶を表示
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  # --- B1 -------------------------------------------------------------
  b1:copy:
    desc: Geant4 の B1 サンプルを g4examples/B1 にコピー
    cmds:
      - cp -R {{.G4_EXAMPLES}}/basic/{{.EXAMPLE_B1}} {{.EXAMPLE_B1}}
    status:
      - test -f {{.EXAMPLE_B1}}/exampleB1.cc

  b1:build:
    desc: B1 サンプルをビルド（未コピーならコピーしてから実行）
    deps: [b1:copy]
    cmds:
      - cmake -S {{.EXAMPLE_B1}} -B {{.EXAMPLE_B1}}/build -DGeant4_DIR={{.G4_PREFIX}}/lib/cmake/Geant4
      - cmake --build {{.EXAMPLE_B1}}/build -j

  b1:run:
    desc: B1 サンプルを batch モードで実行（run1.mac）
    deps: [b1:build]
    dir: '{{.EXAMPLE_B1}}'
    cmds:
      - ./build/exampleB1 run1.mac

  b1:clean:
    desc: B1 のビルド成果物を削除
    cmds:
      - rm -rf {{.EXAMPLE_B1}}/build
