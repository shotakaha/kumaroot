# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!

  # Geant4 version to use
  # Override: `task b1:build G4_VERSION=11.3.2` or set the G4_VERSION environment variable
  G4_VERSION: '{{env "G4_VERSION" | default "11.4.3"}}'
  G4_ROOT: '{{env "G4_ROOT" | default "/Users/shotakaha/geant4"}}'

  # Install location (derived from the version)
  G4_PREFIX: '{{.G4_ROOT}}/v{{.G4_VERSION}}/install'
  G4_ENV_SH: '{{.G4_PREFIX}}/bin/geant4.sh'
  G4_EXAMPLES: '{{.G4_PREFIX}}/share/Geant4/examples'

  # Example names
  EXAMPLE_B1: B1
  EXAMPLE_B2A: B2a
  EXAMPLE_B2B: B2b

tasks:
  default:
    desc: List tasks and usage
    cmds:
      - task --list
      - echo ""
      - 'echo "Next steps:"'
      - 'echo "  1. Check the Geant4 environment:  task g4:env"'
      - 'echo "  2. Build the B1 example:          task b1:build"'
      - 'echo "  3. Run the B1 example:            task b1:run"'
      - echo ""
      - 'echo "Options:"'
      - 'echo "  Use another version:  task b1:build G4_VERSION=11.3.2"'
      - 'echo "  Installed versions:   task g4:versions"'
    silent: true

  hello:
    desc: Print greeting
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  # --- Geant4 environment ---------------------------------------------
  g4:versions:
    desc: List installed versions
    cmds:
      - ls -d {{.G4_ROOT}}/v*/install 2>/dev/null | sed -E 's#.*/v(.*)/install#\1#'
    silent: true

  g4:env:
    desc: Load env and show version
    preconditions:
      - test -f {{.G4_ENV_SH}}
    cmds:
      - cd {{.G4_PREFIX}}/bin && . ./geant4.sh && cd - >/dev/null && geant4-config --version
    silent: true

  # --- B1 -------------------------------------------------------------
  b1:copy:
    desc: Copy B1 example to B1/app
    preconditions:
      - test -d {{.G4_EXAMPLES}}/basic/{{.EXAMPLE_B1}}
    cmds:
      - cp -R {{.G4_EXAMPLES}}/basic/{{.EXAMPLE_B1}} {{.EXAMPLE_B1}}/app
    status:
      - test -f {{.EXAMPLE_B1}}/app/exampleB1.cc

  b1:build:
    desc: Build B1 example (B1/app -> B1/build)
    deps: [b1:copy]
    dir: '{{.EXAMPLE_B1}}'
    preconditions:
      - test -f {{.G4_ENV_SH}}
    cmds:
      - cd {{.G4_PREFIX}}/bin && . ./geant4.sh && cd - >/dev/null && cmake -S app -B build -DGeant4_DIR={{.G4_PREFIX}}/lib/cmake/Geant4
      - cd {{.G4_PREFIX}}/bin && . ./geant4.sh && cd - >/dev/null && cmake --build build -j

  b1:run:
    desc: Run B1 example (app/run1.mac)
    deps: [b1:build]
    dir: '{{.EXAMPLE_B1}}'
    cmds:
      - cd {{.G4_PREFIX}}/bin && . ./geant4.sh && cd - >/dev/null && ./build/exampleB1 app/run1.mac

  b1:clean:
    desc: Clean B1 build
    cmds:
      - rm -rf {{.EXAMPLE_B1}}/build

  # --- B2a ------------------------------------------------------------
  b2a:copy:
    desc: Copy B2a example to B2a/app
    preconditions:
      - test -d {{.G4_EXAMPLES}}/basic/B2/{{.EXAMPLE_B2A}}
    cmds:
      - cp -R {{.G4_EXAMPLES}}/basic/B2/{{.EXAMPLE_B2A}} {{.EXAMPLE_B2A}}/app
    status:
      - test -f {{.EXAMPLE_B2A}}/app/exampleB2a.cc

  b2a:build:
    desc: Build B2a example (B2a/app -> B2a/build)
    deps: [b2a:copy]
    dir: '{{.EXAMPLE_B2A}}'
    preconditions:
      - test -f {{.G4_ENV_SH}}
    cmds:
      - cd {{.G4_PREFIX}}/bin && . ./geant4.sh && cd - >/dev/null && cmake -S app -B build -DGeant4_DIR={{.G4_PREFIX}}/lib/cmake/Geant4
      - cd {{.G4_PREFIX}}/bin && . ./geant4.sh && cd - >/dev/null && cmake --build build -j

  b2a:run:
    desc: Run B2a example (app/run1.mac)
    deps: [b2a:build]
    dir: '{{.EXAMPLE_B2A}}'
    cmds:
      - cd {{.G4_PREFIX}}/bin && . ./geant4.sh && cd - >/dev/null && ./build/exampleB2a app/run1.mac

  b2a:clean:
    desc: Clean B2a build
    cmds:
      - rm -rf {{.EXAMPLE_B2A}}/build

  # --- B2b ------------------------------------------------------------
  b2b:copy:
    desc: Copy B2b example to B2b/app
    preconditions:
      - test -d {{.G4_EXAMPLES}}/basic/B2/{{.EXAMPLE_B2B}}
    cmds:
      - cp -R {{.G4_EXAMPLES}}/basic/B2/{{.EXAMPLE_B2B}} {{.EXAMPLE_B2B}}/app
    status:
      - test -f {{.EXAMPLE_B2B}}/app/exampleB2b.cc

  b2b:build:
    desc: Build B2b example (B2b/app -> B2b/build)
    deps: [b2b:copy]
    dir: '{{.EXAMPLE_B2B}}'
    preconditions:
      - test -f {{.G4_ENV_SH}}
    cmds:
      - cd {{.G4_PREFIX}}/bin && . ./geant4.sh && cd - >/dev/null && cmake -S app -B build -DGeant4_DIR={{.G4_PREFIX}}/lib/cmake/Geant4
      - cd {{.G4_PREFIX}}/bin && . ./geant4.sh && cd - >/dev/null && cmake --build build -j

  b2b:run:
    desc: Run B2b example (app/run1.mac)
    deps: [b2b:build]
    dir: '{{.EXAMPLE_B2B}}'
    cmds:
      - cd {{.G4_PREFIX}}/bin && . ./geant4.sh && cd - >/dev/null && ./build/exampleB2b app/run1.mac

  b2b:clean:
    desc: Clean B2b build
    cmds:
      - rm -rf {{.EXAMPLE_B2B}}/build
