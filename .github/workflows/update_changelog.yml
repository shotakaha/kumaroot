name: Update Changelog


on:
  schedule:
    - cron: "0 0 * * 1"  # 毎週月曜日の午前0時（UTC）に実行
  workflow_dispatch: # 手動トリガーを有効にする

# main への push を1本ずつ直列化する
concurrency:
  group: update-changelog
  cancel-in-progress: false

jobs:
  update_changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # すべての履歴を取得
          fetch-tags: true  # タグを取得
      # uv をインストール
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      # Python をセットアップ
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Git ユーザーを設定
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      # Changelog を更新
      - name: Update Changelog
        run: |
          git tag -l
          uvx --from commitizen cz changelog --incremental
      - name: Commit Changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add CHANGELOG.md
            git commit -m "chore: update changelog [skip ci]"
            # 実行中に main が進んでいても push できるよう追従する
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No changes in CHANGELOG.md Skipping commit."
          fi
